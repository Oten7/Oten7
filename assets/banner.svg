<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Sebastiao Neto — Engenharia de Software</title>
<desc id="desc">Banner animado vermelho e preto inspirado nas cores do Flamengo. Estudante do 2º período. Entre uma aula e outra, um commit.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#09090b"/><stop offset="1" stop-color="#211014"/></linearGradient>
<linearGradient id="red"><stop stop-color="#e31937"/><stop offset="1" stop-color="#ff5368"/></linearGradient>
<linearGradient id="fade"><stop stop-color="#0b0b0e"/><stop offset=".6" stop-color="#0b0b0e" stop-opacity=".95"/><stop offset="1" stop-color="#0b0b0e" stop-opacity="0"/></linearGradient>
<clipPath id="frame"><rect width="1200" height="360" rx="22"/></clipPath>
<clipPath id="shield"><path d="M891 91H1091V199Q1091 263 991 303Q891 263 891 199Z"/></clipPath>
</defs>
<style>
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(-24px)}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes cursor{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}
@keyframes dash{to{stroke-dashoffset:-100}}
.bands{animation:drift 10s ease-in-out infinite}
.halo{animation:breathe 5s ease-in-out infinite}
.cursor{animation:cursor 1.5s steps(1) infinite}
.track{animation:dash 12s linear infinite}
@media(prefers-reduced-motion:reduce){.bands,.halo,.cursor,.track{animation:none}}
</style>
<g clip-path="url(#frame)">
<rect width="1200" height="360" fill="url(#bg)"/>
<g class="bands" transform="skewX(-15)" opacity=".75" fill="#aa1028">
<path d="M800-30H1270V25H800ZM800 70H1270V125H800ZM800 170H1270V225H800ZM800 270H1270V325H800Z"/>
</g>
<rect width="920" height="360" fill="url(#fade)"/>
<path d="M0 0H1200" stroke="url(#red)" stroke-width="6"/>
<path d="M64 330H1136" stroke="#ffffff" stroke-opacity=".08"/>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="64" y="63" fill="#ff6579" font-size="14" font-weight="600" letter-spacing="3">OTEN7 / ENGENHARIA DE SOFTWARE</text>
<text x="60" y="151" fill="#fafafa" font-size="68" font-weight="750" letter-spacing="-2">Sebastiao Neto<tspan fill="#ed2444">.</tspan></text>
<text x="64" y="203" fill="#d4c4c8" font-size="25">Entre uma aula e outra, um commit.</text>
<path class="cursor" d="M486 211H502" stroke="#ff405e" stroke-width="3"/>
<rect x="64" y="251" width="153" height="38" rx="7" fill="#291216" stroke="#66202f"/>
<circle class="halo" cx="82" cy="270" r="4" fill="#ff405e"/>
<text x="96" y="276" fill="#ffe4e8" font-size="14" font-weight="600" letter-spacing="1">2º PERÍODO</text>
<text x="238" y="276" fill="#a18b92" font-size="13" letter-spacing="2">JAVA · PYTHON · WEB</text>
</g>
<path class="track" d="M863 70H1119V200Q1119 281 991 326Q863 281 863 200Z" fill="none" stroke="#ff667b" stroke-opacity=".38" stroke-dasharray="4 16"/>
<!-- Escudo obtido em https://www.flamengo.com.br/ -->
<image x="891" y="80" width="200" height="245" preserveAspectRatio="xMidYMid meet" href="data:image/png;base64,"/>
<text x="991" y="57" text-anchor="middle" fill="#f5c0c8" font-family="Consolas,monospace" font-size="12" letter-spacing="5">RUBRO-NEGRO</text>
</g></svg>